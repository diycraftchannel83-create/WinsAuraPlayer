name: LRC Draft Regression Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/lrc-draft-loss-protection

permissions:
  contents: read

jobs:
  lrc-regression:
    name: LRC draft unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit and regression tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
