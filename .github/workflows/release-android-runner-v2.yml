name: Build and Release WinsAuraPlayer (Ubuntu Hosted Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: winsauraplayer-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
          test -s "$RUNNER_TEMP/my-upload-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Validate signing credentials and resolve alias
        env:
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${STORE_PASSWORD_SECRET:-}" ]]; then
            echo "::error::Missing secret ANDROID_STORE_PASSWORD."
            exit 1
          fi
          if [[ -z "${KEY_PASSWORD_SECRET:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEY_PASSWORD."
            exit 1
          fi

          DETAILS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD_SECRET" 2>&1)" || {
            echo "::error::Could not open keystore. Verify ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD."
            exit 1
          }

          mapfile -t ALIASES < <(printf '%s\n' "$DETAILS" | awk '
            /^Alias name: / { alias=substr($0,13) }
            /^Entry type: PrivateKeyEntry/ && alias != "" { print alias; alias="" }
          ')

          KEY_ALIAS="${KEY_ALIAS_SECRET:-}"
          if [[ -n "$KEY_ALIAS" ]]; then
            if ! printf '%s\n' "${ALIASES[@]}" | grep -Fxq -- "$KEY_ALIAS"; then
              echo "::error::ANDROID_KEY_ALIAS does not match a private-key alias in the keystore."
              exit 1
            fi
          elif [[ "${#ALIASES[@]}" -eq 1 ]]; then
            KEY_ALIAS="${ALIASES[0]}"
          else
            echo "::error::Set ANDROID_KEY_ALIAS to a private-key alias in the keystore."
            exit 1
          fi

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Signing alias validated."

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build release APK and AAB
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease bundleRelease

      - name: Collect and verify release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          [[ -n "$APK" ]] || { echo "::error::Release APK was not generated."; exit 1; }
          [[ -n "$AAB" ]] || { echo "::error::Release AAB was not generated."; exit 1; }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="build-$GITHUB_RUN_NUMBER"
          fi
          cp "$APK" "release-assets/WinsAuraPlayer-$VERSION.apk"
          cp "$AAB" "release-assets/WinsAuraPlayer-$VERSION.aab"
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Upload APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinsAuraPlayer-${{ github.ref_name }}-APK-AAB
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinsAuraPlayer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
