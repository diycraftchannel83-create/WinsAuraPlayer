name: Build and Release WinsAuraPlayer (Ubuntu Hosted Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: winsauraplayer-android-main
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore existing signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64. Keep using the existing release keystore."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/winsauraplayer-upload-key.jks"
          test -s "$RUNNER_TEMP/winsauraplayer-upload-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/winsauraplayer-upload-key.jks" >> "$GITHUB_ENV"

      - name: Validate existing key and automatically resolve alias
        env:
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${STORE_PASSWORD_SECRET:-}" ]] || { echo "::error::Missing ANDROID_STORE_PASSWORD."; exit 1; }
          [[ -n "${KEY_PASSWORD_SECRET:-}" ]] || { echo "::error::Missing ANDROID_KEY_PASSWORD."; exit 1; }

          DETAILS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD_SECRET" 2>&1)" || {
            echo "::error::Cannot open the existing keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD."
            exit 1
          }

          mapfile -t ALIASES < <(printf '%s\n' "$DETAILS" | awk '
            /^Alias name: / { alias=substr($0,13) }
            /^Entry type: PrivateKeyEntry/ && alias != "" { print alias; alias="" }
          ')

          if [[ "${#ALIASES[@]}" -eq 0 ]]; then
            echo "::error::The existing keystore contains no PrivateKeyEntry. A certificate-only keystore cannot sign APK/AAB."
            exit 1
          fi

          REQUESTED_ALIAS="${KEY_ALIAS_SECRET:-}"
          KEY_ALIAS=""
          if [[ -n "$REQUESTED_ALIAS" ]] && printf '%s\n' "${ALIASES[@]}" | grep -Fxq -- "$REQUESTED_ALIAS"; then
            KEY_ALIAS="$REQUESTED_ALIAS"
            echo "Using configured alias found in the existing keystore."
          elif [[ "${#ALIASES[@]}" -eq 1 ]]; then
            KEY_ALIAS="${ALIASES[0]}"
            echo "::notice::ANDROID_KEY_ALIAS was empty or mismatched; automatically using the only private-key alias present in the existing keystore."
          else
            echo "::error::The keystore has multiple private-key aliases and ANDROID_KEY_ALIAS does not match any of them. Set ANDROID_KEY_ALIAS to one of these aliases:"
            printf ' - %s\n' "${ALIASES[@]}"
            exit 1
          fi

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Existing release signing key selected successfully."

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Android and Gradle environment
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run unit tests before creating a release
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK and AAB using the existing key
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease bundleRelease

      - name: Collect and verify release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          [[ -n "$APK" ]] || { echo "::error::Release APK was not generated."; exit 1; }
          [[ -n "$AAB" ]] || { echo "::error::Release AAB was not generated."; exit 1; }

          # Start at v1.0.1, then increment the patch number after each successful build.
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            VERSION="v1.0.1"
            NOTES_BASE=""
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            NOTES_BASE="$LATEST_TAG"
          fi

          cp "$APK" "release-assets/WinsAuraPlayer-$VERSION.apk"
          cp "$AAB" "release-assets/WinsAuraPlayer-$VERSION.aab"
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)

          {
            echo "# WinsAuraPlayer $VERSION"
            echo
            echo "## Patch notes"
            if [[ -n "$NOTES_BASE" ]]; then
              git log --no-merges --pretty=format:'- %s' "$NOTES_BASE"..HEAD
            else
              git log -n 10 --no-merges --pretty=format:'- %s' HEAD
            fi
            echo
            echo
            echo "## Downloads"
            echo "- Android APK: WinsAuraPlayer-$VERSION.apk"
            echo "- Android App Bundle: WinsAuraPlayer-$VERSION.aab"
            echo "- SHA-256 checksums: SHA256SUMS.txt"
          } > release-assets/RELEASE_NOTES.md

          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh release-assets/

      - name: Upload APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinsAuraPlayer-${{ env.RELEASE_VERSION }}-APK-AAB
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          name: WinsAuraPlayer ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: release-assets/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
