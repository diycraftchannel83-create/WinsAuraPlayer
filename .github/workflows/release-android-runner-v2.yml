name: Build and Release WinsAuraPlayer (Windows Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: winsauraplayer-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK (reuse persistent runner installation)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $SdkRoot = Join-Path $env:USERPROFILE ".android\sdk"
          $SdkManager = Join-Path $SdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $SdkManager)) {
            $ZipPath = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
            $ExtractPath = Join-Path $env:RUNNER_TEMP "android-cmdline-tools"
            New-Item -ItemType Directory -Force -Path $SdkRoot, $ExtractPath | Out-Null
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip" -OutFile $ZipPath
            Expand-Archive -LiteralPath $ZipPath -DestinationPath $ExtractPath -Force
            $LatestPath = Join-Path $SdkRoot "cmdline-tools\latest"
            New-Item -ItemType Directory -Force -Path $LatestPath | Out-Null
            Copy-Item (Join-Path $ExtractPath "cmdline-tools\*") -Destination $LatestPath -Recurse -Force
          }

          if (-not (Test-Path $SdkManager)) { throw "Android SDK command-line tools not found: $SdkManager" }

          "ANDROID_HOME=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $SdkRoot "cmdline-tools\latest\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $SdkRoot "platform-tools") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $Packages = @("platform-tools", "platforms;android-36", "build-tools;36.0.0")
          $MissingPackages = @()
          if (-not (Test-Path (Join-Path $SdkRoot "platform-tools\adb.exe"))) { $MissingPackages += "platform-tools" }
          if (-not (Test-Path (Join-Path $SdkRoot "platforms\android-36\android.jar"))) { $MissingPackages += "platforms;android-36" }
          if (-not (Test-Path (Join-Path $SdkRoot "build-tools\36.0.0\aapt.exe"))) { $MissingPackages += "build-tools;36.0.0" }
          if ($MissingPackages.Count -gt 0) {
            & $SdkManager "--sdk_root=$SdkRoot" $MissingPackages
            if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed: $LASTEXITCODE" }
          }

          1..100 | ForEach-Object { "y" } | & $SdkManager "--sdk_root=$SdkRoot" --licenses
          if ($LASTEXITCODE -ne 0) { Write-Warning "License acceptance returned a non-zero code; verify SDK licenses on the runner." }

      - name: Restore signing keystore
        shell: powershell
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) { throw "Missing repository secret ANDROID_KEYSTORE_BASE64." }
          $Encoded = $env:KEYSTORE_B64 -replace '\s', ''
          try { $Bytes = [Convert]::FromBase64String($Encoded) } catch { throw "ANDROID_KEYSTORE_BASE64 is not valid Base64." }

          $KeystorePath = Join-Path $env:GITHUB_WORKSPACE "my-upload-key.jks"
          [System.IO.File]::WriteAllBytes($KeystorePath, $Bytes)
          if ((Get-Item $KeystorePath).Length -eq 0) { throw "Keystore file is empty." }
          "KEYSTORE_PATH=$KeystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate signing credentials and resolve alias
        shell: powershell
        env:
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:STORE_PASSWORD_SECRET)) { throw "Missing secret ANDROID_STORE_PASSWORD." }
          if ([string]::IsNullOrWhiteSpace($env:KEY_PASSWORD_SECRET)) { throw "Missing secret ANDROID_KEY_PASSWORD." }

          $ErrorActionPreference = "Continue"
          $Details = & keytool -list -v -keystore $env:KEYSTORE_PATH -storepass $env:STORE_PASSWORD_SECRET 2>&1
          $KeytoolExitCode = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($KeytoolExitCode -ne 0) { throw "Could not open keystore. Verify ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD." }

          $Aliases = @()
          $CurrentAlias = $null
          foreach ($Line in $Details) {
            $LineText = [string]$Line
            if ($LineText -match '^Alias name: (.+)$') { $CurrentAlias = $Matches[1].Trim() }
            if ($LineText -match '^Entry type: PrivateKeyEntry$' -and $CurrentAlias) {
              $Aliases += $CurrentAlias
              $CurrentAlias = $null
            }
          }

          $KeyAlias = $env:KEY_ALIAS_SECRET
          if (-not [string]::IsNullOrWhiteSpace($KeyAlias) -and $Aliases -notcontains $KeyAlias) {
            Write-Warning "ANDROID_KEY_ALIAS did not match a private-key alias in the keystore; attempting automatic detection."
            $KeyAlias = $null
          }
          if ([string]::IsNullOrWhiteSpace($KeyAlias)) {
            if ($Aliases.Count -eq 1) { $KeyAlias = $Aliases[0] }
            else { throw "Could not determine a unique private-key alias. Set ANDROID_KEY_ALIAS to one of: $($Aliases -join ', ')" }
          }

          "STORE_PASSWORD=$env:STORE_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KEY_PASSWORD=$env:KEY_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KEY_ALIAS=$KeyAlias" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Signing alias validated."

      - name: Build release APK and AAB
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # This repository currently contains gradle-wrapper.properties but no gradlew.bat/gradle-wrapper.jar.
          # Reuse the Gradle 9.3.1 installation/cache on the persistent Windows runner.
          $Gradle = Get-Command gradle -ErrorAction SilentlyContinue
          if (-not $Gradle) {
            $GradlePath = Join-Path $env:USERPROFILE ".gradle\wrapper\dists\gradle-9.3.1-bin"
            $GradleExe = Get-ChildItem $GradlePath -Filter "gradle.bat" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($GradleExe) { $GradleCommand = $GradleExe.FullName }
            else {
              $GradleZip = Join-Path $env:RUNNER_TEMP "gradle-9.3.1-bin.zip"
              $GradleHome = Join-Path $env:RUNNER_TEMP "gradle-9.3.1"
              Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -OutFile $GradleZip
              Expand-Archive -LiteralPath $GradleZip -DestinationPath $GradleHome -Force
              $GradleCommand = Join-Path $GradleHome "gradle-9.3.1\bin\gradle.bat"
            }
          } else { $GradleCommand = $Gradle.Source }

          & $GradleCommand --no-daemon --stacktrace clean assembleRelease bundleRelease
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with exit code $LASTEXITCODE" }

      - name: Collect and verify release files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Assets = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          if (Test-Path $Assets) { Remove-Item $Assets -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $Assets | Out-Null

          $Apk = Get-ChildItem "app\build\outputs\apk\release" -Filter "*.apk" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $Aab = Get-ChildItem "app\build\outputs\bundle\release" -Filter "*.aab" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Apk) { throw "Release APK was not generated in app\build\outputs\apk\release." }
          if (-not $Aab) { throw "Release AAB was not generated in app\build\outputs\bundle\release." }

          $Version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          Copy-Item $Apk.FullName (Join-Path $Assets "WinsAuraPlayer-$Version.apk") -Force
          Copy-Item $Aab.FullName (Join-Path $Assets "WinsAuraPlayer-$Version.aab") -Force
          $Checksums = Get-ChildItem $Assets -File | Where-Object { $_.Extension -in ".apk", ".aab" } | ForEach-Object {
            $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          }
          $Checksums | Set-Content -Path (Join-Path $Assets "SHA256SUMS.txt") -Encoding ascii
          Get-ChildItem $Assets -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload APK and AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinsAuraPlayer-${{ github.ref_name }}-APK-AAB
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinsAuraPlayer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt

      - name: Save build output locally on Windows runner
        if: success()
        shell: powershell
        run: |
          $Source = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          if (Test-Path $Source) {
            $Destination = Join-Path $env:USERPROFILE ("WinsAuraPlayer-builds\" + $env:GITHUB_RUN_NUMBER)
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            Copy-Item (Join-Path $Source "*") -Destination $Destination -Force
            Write-Host "Build outputs copied to: $Destination"
          }
