name: Build and Publish WinsAuraPlayer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Configure signing credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ]; then
            echo "STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::Missing signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS in repository Actions secrets."
            exit 1
          fi
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Rename release files
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk "release-assets/WinsAuraPlayer-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "release-assets/WinsAuraPlayer-${GITHUB_REF_NAME}.aab"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          ls -lah release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinsAuraPlayer-${{ github.ref_name }}-APK-AAB
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinsAuraPlayer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
