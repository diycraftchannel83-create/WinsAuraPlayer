name: Build and Publish WinsAuraPlayer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build APK and AAB
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK command-line tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $SdkRoot = Join-Path $env:USERPROFILE ".android\sdk"
          $SdkManager = Join-Path $SdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $SdkManager)) {
            $ZipPath = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
            $ExtractPath = Join-Path $env:RUNNER_TEMP "android-cmdline-tools"
            New-Item -ItemType Directory -Force -Path $SdkRoot, $ExtractPath | Out-Null
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip" -OutFile $ZipPath
            Expand-Archive -LiteralPath $ZipPath -DestinationPath $ExtractPath -Force
            $LatestPath = Join-Path $SdkRoot "cmdline-tools\latest"
            New-Item -ItemType Directory -Force -Path $LatestPath | Out-Null
            Copy-Item (Join-Path $ExtractPath "cmdline-tools\*") -Destination $LatestPath -Recurse -Force
          }
          if (-not (Test-Path $SdkManager)) {
            throw "Android SDK command-line tools were not installed at $SdkManager"
          }
          "ANDROID_HOME=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $SdkRoot "cmdline-tools\latest\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $SdkRoot "platform-tools") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $SdkManager "--sdk_root=$SdkRoot" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager package installation failed with exit code $LASTEXITCODE" }
          1..100 | ForEach-Object { "y" } | & $SdkManager "--sdk_root=$SdkRoot" --licenses
          if ($LASTEXITCODE -ne 0) { Write-Warning "Some SDK licenses may already have been accepted or could not be reprocessed." }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Configure and validate signing credentials
        shell: bash
        env:
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD_SECRET" ] || [ -z "$KEY_PASSWORD_SECRET" ]; then
            echo "::error::Missing signing secrets: ANDROID_STORE_PASSWORD and/or ANDROID_KEY_PASSWORD."
            exit 1
          fi

          KEY_ALIAS="$KEY_ALIAS_SECRET"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD_SECRET" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD_SECRET" 2>/dev/null | awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Could not find a private-key alias in the keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD."
            exit 1
          fi

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        shell: bash
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Rename release files
        shell: bash
        run: |
          mkdir -p release-assets
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
            echo "::error::APK or AAB output was not generated."
            exit 1
          fi
          cp "$APK_PATH" "release-assets/WinsAuraPlayer-${GITHUB_REF_NAME}.apk"
          cp "$AAB_PATH" "release-assets/WinsAuraPlayer-${GITHUB_REF_NAME}.aab"
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lah release-assets

      - name: Save build files on this PC
        shell: powershell
        run: |
          $destination = Join-Path $env:USERPROFILE ("WinsAuraPlayer-builds\" + $env:GITHUB_RUN_NUMBER)
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "release-assets\*" -Destination $destination -Force
          Write-Host "Build files saved to: $destination"
          Get-ChildItem $destination | Select-Object Name, Length

      - name: Upload build artifacts (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v4
        with:
          name: WinsAuraPlayer-${{ github.ref_name }}-APK-AAB
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinsAuraPlayer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
