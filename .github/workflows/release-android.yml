name: Build and Publish WinsAuraPlayer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build APK and AAB
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK command-line tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $SdkRoot = Join-Path $env:USERPROFILE ".android\sdk"
          $SdkManager = Join-Path $SdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $SdkManager)) {
            $ZipPath = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
            $ExtractPath = Join-Path $env:RUNNER_TEMP "android-cmdline-tools"
            New-Item -ItemType Directory -Force -Path $SdkRoot, $ExtractPath | Out-Null
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip" -OutFile $ZipPath
            Expand-Archive -LiteralPath $ZipPath -DestinationPath $ExtractPath -Force
            $LatestPath = Join-Path $SdkRoot "cmdline-tools\latest"
            New-Item -ItemType Directory -Force -Path $LatestPath | Out-Null
            Copy-Item (Join-Path $ExtractPath "cmdline-tools\*") -Destination $LatestPath -Recurse -Force
          }
          if (-not (Test-Path $SdkManager)) {
            throw "Android SDK command-line tools were not installed at $SdkManager"
          }
          "ANDROID_HOME=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $SdkRoot "cmdline-tools\latest\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $SdkRoot "platform-tools") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $SdkManager "--sdk_root=$SdkRoot" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager package installation failed with exit code $LASTEXITCODE" }
          1..100 | ForEach-Object { "y" } | & $SdkManager "--sdk_root=$SdkRoot" --licenses
          if ($LASTEXITCODE -ne 0) { Write-Warning "Some SDK licenses may already have been accepted or could not be reprocessed." }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode release keystore
        shell: powershell
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) {
            Write-Host "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          }
          $encoded = $env:KEYSTORE_B64 -replace '\s', ''
          try {
            $bytes = [Convert]::FromBase64String($encoded)
          } catch {
            Write-Host "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          }
          $keystorePath = Join-Path $env:GITHUB_WORKSPACE "my-upload-key.jks"
          [System.IO.File]::WriteAllBytes($keystorePath, $bytes)
          if (-not (Test-Path $keystorePath) -or (Get-Item $keystorePath).Length -eq 0) {
            throw "Keystore file was not created or is empty."
          }
          "KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and validate signing credentials
        shell: powershell
        env:
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:STORE_PASSWORD_SECRET) -or [string]::IsNullOrWhiteSpace($env:KEY_PASSWORD_SECRET)) {
            Write-Host "::error::Missing signing secrets: ANDROID_STORE_PASSWORD and/or ANDROID_KEY_PASSWORD."
            exit 1
          }
          if (-not (Test-Path $env:KEYSTORE_PATH)) {
            throw "Keystore file not found at KEYSTORE_PATH."
          }

          $keyAlias = $env:KEY_ALIAS_SECRET
          if (-not [string]::IsNullOrWhiteSpace($keyAlias)) {
            & keytool -list -keystore $env:KEYSTORE_PATH -storepass $env:STORE_PASSWORD_SECRET -alias $keyAlias 2>$null
            $aliasValid = ($LASTEXITCODE -eq 0)
          } else {
            $aliasValid = $false
          }

          if (-not $aliasValid) {
            $details = & keytool -list -v -keystore $env:KEYSTORE_PATH -storepass $env:STORE_PASSWORD_SECRET 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Could not open keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD."
              exit 1
            }
            $currentAlias = $null
            foreach ($line in $details) {
              if ($line -match '^Alias name: (.+)$') { $currentAlias = $Matches[1].Trim() }
              if ($line -match '^Entry type: PrivateKeyEntry$' -and $currentAlias) {
                $keyAlias = $currentAlias
                break
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($keyAlias)) {
            Write-Host "::error::Could not find a private-key alias in the keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD."
            exit 1
          }

          "STORE_PASSWORD=$env:STORE_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KEY_PASSWORD=$env:KEY_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KEY_ALIAS=$keyAlias" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release APK and AAB
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & gradle --no-daemon clean assembleRelease bundleRelease
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with exit code $LASTEXITCODE" }

      - name: Rename release files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $assets = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $apk = Get-ChildItem "app\build\outputs\apk\release" -Filter "*.apk" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $aab = Get-ChildItem "app\build\outputs\bundle\release" -Filter "*.aab" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $apk -or -not $aab) {
            Write-Host "::error::APK or AAB output was not generated."
            exit 1
          }
          Copy-Item $apk.FullName (Join-Path $assets "WinsAuraPlayer-$env:GITHUB_REF_NAME.apk") -Force
          Copy-Item $aab.FullName (Join-Path $assets "WinsAuraPlayer-$env:GITHUB_REF_NAME.aab") -Force
          $checksums = Get-ChildItem $assets -File | Where-Object { $_.Extension -in ".apk", ".aab" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path (Join-Path $assets "SHA256SUMS.txt") -Encoding ascii
          Get-ChildItem $assets | Select-Object Name, Length

      - name: Save build files on this PC
        shell: powershell
        run: |
          $destination = Join-Path $env:USERPROFILE ("WinsAuraPlayer-builds\" + $env:GITHUB_RUN_NUMBER)
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "release-assets\*" -Destination $destination -Force
          Write-Host "Build files saved to: $destination"
          Get-ChildItem $destination | Select-Object Name, Length

      - name: Upload build artifacts (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v4
        with:
          name: WinsAuraPlayer-${{ github.ref_name }}-APK-AAB
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinsAuraPlayer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
